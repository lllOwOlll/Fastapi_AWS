services:
  api:
    build: .

    env_file:
      - .env

    environment:
      DB_HOST: ${DB_HOST}
      REDIS_HOST: redis

    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results

    depends_on:
      - redis


  worker:
    build: .

    command: python worker.py

    env_file:
      - .env

    environment:
      DB_HOST: ${DB_HOST}
      REDIS_HOST: redis

    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./logs:/app/logs

    depends_on:
      - redis


  redis:
    image: redis:latest
    container_name: fastapi-redis


  nginx:
    image: nginx:latest
    container_name: fastapi-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api